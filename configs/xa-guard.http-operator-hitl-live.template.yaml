# Frozen template for the independent HTTP Agent/Operator HITL live.
# Placeholders are rendered into a new gitignored evidence directory; this
# template is not passed directly to xa_guard.server.
xa_guard:
  upstream:
    transport: streamable-http
    host: 127.0.0.1
    port: 18766
    session_idle_timeout_seconds: 60

  downstream:
    - name: http_hitl_counter_target
      command: ["python", "-m", "demo.targets.http_hitl_target"]
      transport: stdio
      env_passthrough: [PYTHONPATH, PYTHONIOENCODING, XA_HITL_TARGET_LEDGER]

  identity:
    enabled: true
    required: true
    required_scopes: [xa.invoke]
    max_token_ttl_seconds: 300
    clock_skew_seconds: 30
    issuers:
      - issuer: https://xa-guard.local/http-hitl
        audiences: [urn:xa-guard:http-hitl]
        jwks_file: __XA_HITL_JWKS_FILE_YAML__
        algorithms: [RS256]

  governance:
    enabled: false
    default_tenant: acme-corp

  gates:
    gate1:
      enabled: true
      detectors:
        - name: rule
          type: rule
          enabled: true
          patterns_file: policies/baseline/gate1_input_patterns.yaml
      patterns_file: policies/baseline/gate1_input_patterns.yaml
    gate2:
      enabled: true
      hitl_required_for: [red]
      approval_token_ttl_seconds: 180
      elicitation_fallback: deny
      tool_risk_file: policies/baseline/gate2_tool_risks.yaml
      prefer_layered: false
    gate3:
      enabled: true
      backend: python
      policy_file: policies/baseline/gate3_rules.yaml
      prefer_layered: false
    gate4:
      enabled: true
      strict_mode: false
      tool_capabilities_file: policies/baseline/gate4_capabilities.yaml
      prefer_layered: false
    gate5:
      enabled: false
    gate6:
      enabled: true
      audit_dir: __XA_HITL_AUDIT_DIR_YAML__
      hash_algo: sha256
    policy_layered:
      enabled: false

  pending_approvals_path: __XA_HITL_PENDING_PATH_YAML__
